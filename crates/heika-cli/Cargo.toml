[package]
name = "heika-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "heika"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
der = "0.8.2"
getrandom = "0.4.3"
heika-cert = { version = "0.1.0", path = "../heika-cert" }
heika-core = { version = "0.1.0", path = "../heika-core" }
heika-tls = { version = "0.1.0", path = "../heika-tls" }
heika-wallet = { version = "0.1.0", path = "../heika-wallet" }
zeroize = "1.9.1"
