[workspace]
resolver = "3"
members = ["crates/*"]
# heika-vectors はネットワークから公式ベクターを取ってくるので、明示したときだけ対象にする
default-members = ["crates/heika-block", "crates/heika-cert", "crates/heika-cli", "crates/heika-core", "crates/heika-harvesting", "crates/heika-p2p", "crates/heika-tls", "crates/heika-transaction", "crates/heika-wallet"]

[workspace.package]
version = "0.4.0"
edition = "2024"
license = "AGPL-3.0-only"
rust-version = "1.99"

# 署名やハッシュの計算は、最適化しないと公式ベクターの照合に何十倍もかかるので、依存だけは開発中も最適化する
[profile.dev.package."*"]
opt-level = 3
