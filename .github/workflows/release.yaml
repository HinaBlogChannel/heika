# v1.2.3 の形のタグで、そのコミットの master の CI（ci.yaml）が作ったものを Release と Pages と ghcr.io のコンテナイメージに出す。
# ビルドはし直さない。
#
# - CI がまだ走っていれば、終わるまで待つ。CI が落ちていたら、何も出さずに落ちる
# - タグと Cargo.toml の版が同じか、Release に載せるファイルがそろっているか、
#   それぞれに CI の来歴の証明が付いているか、APK が決めた鍵で署名されているかを確かめてから出す
# - 落ちたら、CI を直して master に push し直すか、CI が通ったあとでこのワークフローを Re-run する
name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # APK を署名する鍵の証明書の SHA-256。README の「インストール」にも同じものを書いている
  APK_CERT_SHA256: 79b38fb9557cf0249f75aadf806805f3e5b4f6b196a69b6f986c075cdb64c5ad

jobs:
  # 版を確かめ、このコミットの CI が通るのを待つ。release と container は、このあと並んで走る
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
    outputs:
      run-id: ${{ steps.ci.outputs.run-id }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: タグと Cargo.toml の版が同じか確かめる
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "heika-cli") | .version')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::タグ $GITHUB_REF_NAME と Cargo.toml の版 $version が違います"
            exit 1
          fi
      - name: このコミットの master の CI が終わるのを待つ
        id: ci
        run: |
          while :; do
            run=$(gh run list --workflow ci.yaml --branch master --event push --commit "$GITHUB_SHA" \
              --limit 1 --json databaseId,status,conclusion,url --jq '.[0] // empty')
            if [ -z "$run" ]; then
              echo "このコミットの CI の実行がまだありません"
            elif [ "$(jq -r .status <<< "$run")" != completed ]; then
              echo "CI が走っています: $(jq -r .url <<< "$run")"
            elif [ "$(jq -r .conclusion <<< "$run")" = success ]; then
              echo "run-id=$(jq -r .databaseId <<< "$run")" >> "$GITHUB_OUTPUT"
              exit 0
            else
              echo "::error::このコミットの CI が通っていません（$(jq -r .conclusion <<< "$run")）: $(jq -r .url <<< "$run")"
              exit 1
            fi
            sleep 60
          done

  release:
    needs: ci
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
      attestations: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          run-id: ${{ needs.ci.outputs.run-id }}
          github-token: ${{ github.token }}
          pattern: heika-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          run-id: ${{ needs.ci.outputs.run-id }}
          github-token: ${{ github.token }}
          name: site
          path: site
      - name: Release に載せるファイルが、過不足なくそろっているか確かめる
        run: |
          v=$GITHUB_REF_NAME
          expected=(
            "heika-$v-x86_64-unknown-linux-musl.tar.gz"
            "heika-$v-aarch64-unknown-linux-musl.tar.gz"
            "heika-$v-aarch64-apple-darwin.tar.gz"
            "heika-$v-x86_64-pc-windows-msvc.zip"
            "heika-gui-$v-linux-x86_64.deb"
            "heika-gui-$v-linux-x86_64.rpm"
            "heika-gui-$v-linux-x86_64.AppImage"
            "heika-gui-$v-macos-aarch64.dmg"
            "heika-gui-$v-windows-x86_64.msi"
            "heika-gui-$v-windows-x86_64-setup.exe"
            "heika-gui-$v-android-aarch64.apk"
            "heika-gui-$v-ios-aarch64-unsigned.ipa"
          )
          if ! diff <(printf '%s\n' "${expected[@]}" | sort) <(ls dist | sort); then
            echo "::error::Release に載せるファイルが、決めたものと違います（< が足りないもの、> が余計なもの）"
            exit 1
          fi
      - name: どのファイルにも、このリポジトリの CI の来歴の証明が付いているか確かめる
        run: |
          for file in dist/*; do
            gh attestation verify "$file" --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/ci.yaml" > /dev/null
            echo "ok: $file"
          done
      - name: APK が決めた鍵で署名されているか確かめる
        run: |
          build_tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          # 版によって `Signer #1 certificate …` とも `V3.0 Signer: certificate …` とも出るので、どちらも拾う
          # パイプにすると apksigner が落ちても気づけないので、いったんファイルに書く
          "$build_tools/apksigner" verify --print-certs dist/*.apk > apksigner.txt
          cat apksigner.txt
          digests=$(sed -n 's/^.*Signer.* certificate SHA-256 digest: //p' apksigner.txt | sort -u)
          if [ "$digests" != "$APK_CERT_SHA256" ]; then
            echo "::error::APK の署名の鍵が違います: $digests"
            exit 1
          fi
      - name: チェックサム
        run: (cd dist && sha256sum heika-* > SHA256SUMS)
      - name: Release を作る
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag --title "heika $GITHUB_REF_NAME" \
            --notes-file .github/release-notes.md --generate-notes
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  # CI が作ったコンテナイメージ（OCI のアーカイブ）を、ビルドし直さずに ghcr.io に写す。版のタグと latest を付ける。
  # 同じものを写し直すだけなので、落ちたらこのジョブだけ Re-run すればよい
  container:
    needs: ci
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      attestations: read
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          run-id: ${{ needs.ci.outputs.run-id }}
          github-token: ${{ github.token }}
          name: container-image
          path: dist
      - name: イメージに、このリポジトリの CI の来歴の証明が付いているか確かめる
        run: |
          gh attestation verify "dist/heika-image-$GITHUB_REF_NAME.tar" --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/ci.yaml" > /dev/null
      - name: ghcr.io に写す
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for tag in "$GITHUB_REF_NAME" latest; do
            # digest が変わるなら写さずに落とす（CI で付けた証明は、その digest に付いている）
            skopeo copy --all --preserve-digests "oci-archive:dist/heika-image-$GITHUB_REF_NAME.tar" "docker://$image:$tag"
          done
          gh attestation verify "oci://$image:$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/ci.yaml" > /dev/null
          echo "ok: $image:$GITHUB_REF_NAME"

  # examples/web-vanitygen は https://hinablogchannel.github.io/heika/examples/web-vanitygen/ に、
  # examples/sunboru-kusa は https://hinablogchannel.github.io/heika/examples/sunboru-kusa/ に、
  # crate の API の文書は https://hinablogchannel.github.io/heika/crates/ になる
  pages:
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}examples/web-vanitygen/
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
