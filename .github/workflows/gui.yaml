# apps/heika-gui（Tauri の GUI）を、デスクトップの3つと Android と iOS 向けにビルドして、ワークフローの Artifact に上げる。
# 手で回すときだけ動く。Release には載せない。
#
# - 画面（trunk で作る wasm）は1回だけ作り、それぞれのジョブに配る
# - Android の APK は、ジョブの中で作る使い捨ての鍵で署名する。ビルドごとに鍵が変わるので、入れ直すときは先にアンインストールする
# - iOS は署名しない .app を Payload/ に入れた IPA にする。そのままでは入れられず、AltStore などで署名し直す前提。
#   まだ試しているところなので、失敗してもほかのジョブは止めない
name: GUI

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.99.0
  TRUNK: 0.21.14
  TRUNK_SHA256: f2b4680cd239693a646a2795e4633c625328d7b2a044fbe749fa3a2fe9e7036b
  TAURI_CLI: npx --yes @tauri-apps/cli@2.12.3

defaults:
  run:
    shell: bash
    working-directory: apps/heika-gui

jobs:
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust のツールチェイン
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target wasm32-unknown-unknown
          rustup default "$RUST_TOOLCHAIN"
      - name: trunk
        run: |
          curl -sSfLo trunk.tar.gz "https://github.com/trunk-rs/trunk/releases/download/v$TRUNK/trunk-x86_64-unknown-linux-gnu.tar.gz"
          echo "$TRUNK_SHA256  trunk.tar.gz" | sha256sum -c -
          tar xzf trunk.tar.gz -C "$HOME/.cargo/bin" trunk
      - name: 画面
        run: trunk build --release --locked
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend
          path: apps/heika-gui/dist
          if-no-files-found: error

  desktop:
    needs: frontend
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frontend
          path: apps/heika-gui/dist
      - name: 画面は frontend のジョブで作ったものを使い、ビルドの前に trunk を走らせない
        run: jq '.build.beforeBuildCommand = ""' src-tauri/tauri.conf.json > conf.json && mv conf.json src-tauri/tauri.conf.json
      - name: Linux で WebKitGTK などを入れる
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Rust のツールチェイン
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - name: ビルド
        run: |
          $TAURI_CLI icon icon.png
          $TAURI_CLI build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: heika-gui-${{ runner.os }}
          path: |
            apps/heika-gui/target/release/bundle/*/*.deb
            apps/heika-gui/target/release/bundle/*/*.rpm
            apps/heika-gui/target/release/bundle/*/*.AppImage
            apps/heika-gui/target/release/bundle/*/*.dmg
            apps/heika-gui/target/release/bundle/*/*.msi
            apps/heika-gui/target/release/bundle/*/*.exe
          if-no-files-found: error

  android:
    needs: frontend
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frontend
          path: apps/heika-gui/dist
      - name: 画面は frontend のジョブで作ったものを使い、ビルドの前に trunk を走らせない
        run: jq '.build.beforeBuildCommand = ""' src-tauri/tauri.conf.json > conf.json && mv conf.json src-tauri/tauri.conf.json
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Rust のツールチェイン
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target aarch64-linux-android
          rustup default "$RUST_TOOLCHAIN"
      - name: Android のプロジェクトを作る
        # ランナーに入っている Android SDK と NDK を使う
        run: |
          echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          NDK_HOME="$ANDROID_NDK_LATEST_HOME" $TAURI_CLI android init --ci
          # プロジェクトを作ったあとに作ると、Android のアイコンもそこに入る
          $TAURI_CLI icon icon.png
      - name: ビルド
        run: $TAURI_CLI android build --apk --target aarch64
      - name: 使い捨ての鍵で署名する
        run: |
          build_tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          unsigned=$(find src-tauri/gen/android/app/build/outputs/apk -name '*-unsigned.apk' | head -1)
          keytool -genkeypair -keystore throwaway.jks -storepass throwaway -keypass throwaway \
            -alias heika -keyalg RSA -keysize 2048 -validity 1 -dname 'CN=heika-gui test build'
          "$build_tools/zipalign" -p 4 "$unsigned" aligned.apk
          "$build_tools/apksigner" sign --ks throwaway.jks --ks-pass pass:throwaway --out heika-gui-android-aarch64.apk aligned.apk
          "$build_tools/apksigner" verify heika-gui-android-aarch64.apk
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: heika-gui-android
          path: apps/heika-gui/heika-gui-android-aarch64.apk
          if-no-files-found: error

  ios:
    needs: frontend
    runs-on: macos-15
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frontend
          path: apps/heika-gui/dist
      - name: 画面は frontend のジョブで作ったものを使い、ビルドの前に trunk を走らせない
        run: jq '.build.beforeBuildCommand = ""' src-tauri/tauri.conf.json > conf.json && mv conf.json src-tauri/tauri.conf.json
      - name: Rust のツールチェイン
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target aarch64-apple-ios
          rustup default "$RUST_TOOLCHAIN"
      - name: Xcode のプロジェクトを作る
        run: |
          brew install xcodegen
          $TAURI_CLI ios init --ci
          # プロジェクトを作ったあとに作ると、iOS のアイコンもそこに入る
          $TAURI_CLI icon icon.png
      - name: 署名せずにビルドする
        run: |
          project=$(ls -d src-tauri/gen/apple/*.xcodeproj | head -1)
          scheme=$(xcodebuild -list -project "$project" -json | jq -r '.project.schemes[] | select(endswith("_iOS"))' | head -1)
          xcodebuild -project "$project" -scheme "$scheme" -configuration release -sdk iphoneos \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' \
            build
      - name: IPA にまとめる
        run: |
          app=$(find build/Build/Products -name '*.app' -maxdepth 2 | head -1)
          mkdir Payload
          cp -R "$app" Payload/
          zip -qr heika-gui-ios-UNSUPPORTED.ipa Payload
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: heika-gui-ios-UNSUPPORTED
          path: apps/heika-gui/heika-gui-ios-UNSUPPORTED.ipa
          if-no-files-found: error
