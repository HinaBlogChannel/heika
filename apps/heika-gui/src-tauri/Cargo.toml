[package]
name = "heika-gui"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

# モバイルでは、この lib を Android と iOS のアプリから読み込む
[lib]
name = "heika_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
heika-core = { path = "../../../crates/heika-core" }
serde = { version = "1.0.229", features = ["derive"] }
tauri = { version = "2.12.4", features = [] }
