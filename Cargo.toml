[workspace]
resolver = "3"
members = ["crates/*"]
# heika-vectors はネットワークから公式ベクターを取ってくるので、明示したときだけ対象にする
default-members = ["crates/heika-api", "crates/heika-block", "crates/heika-chain", "crates/heika-cert", "crates/heika-finalization", "crates/heika-cli", "crates/heika-core", "crates/heika-harvesting", "crates/heika-mempool", "crates/heika-node", "crates/heika-peer-protocol", "crates/heika-packet", "crates/heika-peer", "crates/heika-rest", "crates/heika-state-transition", "crates/heika-store-redb", "crates/heika-tls", "crates/heika-transaction", "crates/heika-wallet"]

[workspace.package]
version = "0.13.1"
edition = "2024"
license = "AGPL-3.0-only"
rust-version = "1.99"

# 署名やハッシュの計算は、最適化しないと公式ベクターの照合に何十倍もかかるので、依存だけは開発中も最適化する
[profile.dev.package."*"]
opt-level = 3

# 配るバイナリを小さくする。暗号の計算が遅くならないように、opt-level は既定の 3 のままにする
[profile.release]
lto = "fat"
codegen-units = 1
