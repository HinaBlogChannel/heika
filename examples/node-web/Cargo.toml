[package]
name = "node-web"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

# heika のワークスペースには入れず、依存と Cargo.lock と最適化の設定を分ける
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

# 画面。trunk が index.html から組み立てる
[[bin]]
name = "app"
path = "src/bin/app.rs"

# DB を持つ Web Worker。OPFS の同期ハンドルは Dedicated Worker でしか使えない
[[bin]]
name = "worker"
path = "src/bin/worker.rs"

[dependencies]
futures = { version = "0.3.34", default-features = false, features = ["std"] }
heika-core = { path = "../../crates/heika-core", default-features = false, features = ["wasm_js"] }
heika-block = { path = "../../crates/heika-block" }
heika-chain = { path = "../../crates/heika-chain" }
heika-packet = { path = "../../crates/heika-packet" }
heika-harvesting = { path = "../../crates/heika-harvesting" }
heika-rest = { path = "../../crates/heika-rest" }
heika-state-transition = { path = "../../crates/heika-state-transition" }
heika-store-redb = { path = "../../crates/heika-store-redb" }
heika-wallet = { path = "../../crates/heika-wallet", default-features = false }
zeroize = "1.9.1"
serde_json = "1.0.151"
js-sys = "0.3.106"
leptos = { version = "0.8.22", features = ["csr"] }
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4.79"
web-sys = { version = "0.3.106", features = [
  "Blob",
  "Crypto",
  "CryptoKey",
  "DomException",
  "IdbDatabase",
  "IdbFactory",
  "IdbObjectStore",
  "IdbOpenDbRequest",
  "IdbRequest",
  "IdbTransaction",
  "IdbTransactionMode",
  "SubtleCrypto",
  "File",
  "FileList",
  "HtmlInputElement",
  "DedicatedWorkerGlobalScope",
  "FileSystemDirectoryHandle",
  "FileSystemFileHandle",
  "FileSystemGetFileOptions",
  "FileSystemReadWriteOptions",
  "FileSystemSyncAccessHandle",
  "MessageEvent",
  "Performance",
  "RequestInit",
  "Response",
  "Storage",
  "StorageManager",
  "Window",
  "Worker",
  "WorkerGlobalScope",
  "WorkerNavigator",
] }

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
opt-level = 3
