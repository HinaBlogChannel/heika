[package]
name = "heika-vectors"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Symbol の公式テストベクター、公式の Python SDK で作ったベクター、メインネットのブロックとの照合"
publish = false

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }

[dev-dependencies]
heika-block = { path = "../heika-block" }
heika-cert = { path = "../heika-cert" }
heika-core = { path = "../heika-core" }
heika-p2p = { path = "../heika-p2p" }
heika-rest = { path = "../heika-rest" }
heika-tls = { path = "../heika-tls" }
heika-transaction = { path = "../heika-transaction" }
heika-wallet = { path = "../heika-wallet" }
# age のテストベクターのうち、zlib で縮めてあるものを戻す
miniz_oxide = "0.9.1"
rand_core = { version = "0.10.1", default-features = false }
sha2 = "0.11.0"
