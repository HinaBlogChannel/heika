# master への push と PR で、整形、clippy、テスト、ベクターとの照合、依存のライセンスの一覧の確認をする。
# release.yaml からも、ビルドと並べて呼ぶ
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  # release.yaml から呼ばれたときは github.workflow が Release になるので、push の CI を止めない
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.99.0
  CARGO_ABOUT: 0.9.2

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust のツールチェイン
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy
          rustup default "$RUST_TOOLCHAIN"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --locked
      - name: heika-cert を feature つきのモジュールも含めて
        run: cargo test -p heika-cert --all-features --locked

  vectors:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust のツールチェイン
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: 公式ベクターと SDK のベクターとの照合
        run: cargo test -p heika-vectors --locked -- --include-ignored
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: SDK のベクターを作り直して、コミットしたものと同じか確かめる
        run: |
          uv run crates/heika-vectors/scripts/generate-sdk-vectors.py > crates/heika-vectors/testdata/sdk-transactions.json
          git diff --exit-code

  licenses:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust のツールチェイン
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo install cargo-about --version "$CARGO_ABOUT" --locked --features cli
      - name: 依存のライセンスの一覧を作り直して、コミットしたものと同じか確かめる
        working-directory: crates/heika-cli
        run: |
          cargo about generate --locked about.hbs -o THIRD-PARTY-LICENSES
          git diff --exit-code
