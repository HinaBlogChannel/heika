[package]
name = "heika-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# モバイルでは、この lib を Android と iOS のアプリから読み込む
[lib]
name = "heika_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
getrandom = { version = "0.4.3", features = ["sys_rng"] }
heika-core = { path = "../../../crates/heika-core" }
heika-rest = { path = "../../../crates/heika-rest" }
heika-transaction = { path = "../../../crates/heika-transaction" }
heika-wallet = { path = "../../../crates/heika-wallet" }
rand_core = "0.10.1"
# REST に HTTPS でつなぐ。ルート証明書は、同梱の一覧ではなく OS のものを使う
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2.12.4", features = ["tray-icon"] }
ureq = { version = "3.4.2", default-features = false, features = ["rustls-no-provider", "platform-verifier"] }
zeroize = "1.9.1"

# ノード（試験的）はデスクトップだけ
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
heika-node = { path = "../../../crates/heika-node" }

# WebKitGTK が、持ち主のいないクリップボードから貼り付けると落ちるのを避ける（src/clipboard.rs）。Tauri が使っているのと同じ版
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18.2"
