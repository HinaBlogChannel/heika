[package]
name = "heika-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Symbol のノードと同じ計算をするもの。アドレス、鍵、署名、Merkle ツリー"

[dependencies]
base16ct = "1.0.0"
curve25519-dalek = "5.0.0"
getrandom = { version = "0.4.3", optional = true }
rand_core = { version = "0.10.1", default-features = false }
ripemd = "0.2.0"
sha2 = { version = "0.11.0", default-features = false, features = ["zeroize"] }
sha3 = "0.12.0"
zeroize = "1.9.1"

[features]
default = ["std", "getrandom"]
# OS の時刻とネットワーク時刻の行き来（NetworkParameters::timestamp_at など）。no_std では外す
std = []
# OS の乱数で秘密鍵を作る PrivateKey::generate。乱数を自分で渡すなら要らない
getrandom = ["dep:getrandom"]
# ブラウザ（wasm32-unknown-unknown）で getrandom を使うときに、Web Crypto の乱数を使う。getrandom の版を合わせなくて済むように出しておく
wasm_js = ["getrandom", "getrandom/wasm_js"]
# 使い方を誤ると鍵が漏れる、Ed25519 の中の部品（hazmat）。アダプター署名のような、ふつうでない署名を組むときに使う
hazmat = []
