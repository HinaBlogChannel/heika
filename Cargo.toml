[workspace]
resolver = "3"
members = ["crates/*"]
# heika-vectors はネットワークから公式ベクターを取ってくるので、明示したときだけ対象にする
default-members = ["crates/heika-cert", "crates/heika-cli", "crates/heika-core", "crates/heika-p2p", "crates/heika-tls", "crates/heika-transaction", "crates/heika-wallet"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
rust-version = "1.99"
