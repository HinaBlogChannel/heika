[package]
name = "heika-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Symbol のノード運営のための、鍵と証明書のコマンドラインツール"

[[bin]]
name = "heika"
path = "src/main.rs"

[dependencies]
heika-node = { path = "../heika-node" }
clap = { version = "4.6.7", features = ["derive"] }
der = "0.8.2"
getrandom = { version = "0.4.3", features = ["sys_rng"] }
heika-block = { version = "0.11.0", path = "../heika-block" }
heika-cert = { version = "0.11.0", path = "../heika-cert", features = ["bootstrap-compat", "shoestring-compat"] }
heika-core = { version = "0.11.0", path = "../heika-core" }
heika-harvesting = { version = "0.11.0", path = "../heika-harvesting" }
heika-peer-protocol = { version = "0.11.0", path = "../heika-peer-protocol" }
heika-packet = { version = "0.11.0", path = "../heika-packet" }
heika-rest = { version = "0.11.0", path = "../heika-rest" }
heika-tls = { version = "0.11.0", path = "../heika-tls" }
heika-transaction = { version = "0.11.0", path = "../heika-transaction" }
heika-wallet = { version = "0.11.0", path = "../heika-wallet" }
rand_core = "0.10.1"
# REST に HTTPS でつなぐ。ルート証明書は、同梱の一覧ではなく OS のものを使う
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std"] }
ureq = { version = "3.4.2", default-features = false, features = ["rustls-no-provider", "platform-verifier"] }
zeroize = "1.9.1"

[target.'cfg(unix)'.dependencies]
# 端末から秘密を読むあいだ、termios で打った文字を画面に出さないようにする
libc = "0.2.190"

[target.'cfg(windows)'.dependencies]
# 端末から秘密を読むあいだ、コンソールのモードで打った文字を画面に出さないようにする
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Console"] }

[dev-dependencies]
# 自前で書く peers-p2p.json を、別の実装で読み戻して確かめる
serde_json = "1.0.151"
