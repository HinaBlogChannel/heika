[package]
name = "heika-cert"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "ノードの TLS で使う鍵と証明書のファイル"

[dependencies]
base64ct = "1.8.3"
der = { version = "0.8.2", features = ["derive"] }
heika-core = { path = "../heika-core", default-features = false }
sha1 = { version = "0.11.0", default-features = false }
x509-cert = "0.3.0"
zeroize = "1.9.1"

[features]
# shoestring が作るノードの証明書のフォルダーを扱う heika_cert::certs_dir
shoestring-compat = []
# symbol-bootstrap が作るノードの証明書のフォルダーを扱う heika_cert::certs_dir
bootstrap-compat = []
