[package]
name = "heika-node"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Symbol のノードを組み立てて動かす。設定、ピアのスレッド、待ち受け、追いつく段階と先端の段階"

[dependencies]
heika-block = { path = "../heika-block" }
heika-chain = { path = "../heika-chain" }
heika-cert = { path = "../heika-cert" }
heika-core = { path = "../heika-core" }
heika-mempool = { path = "../heika-mempool" }
heika-packet = { path = "../heika-packet" }
heika-peer = { path = "../heika-peer" }
heika-peer-protocol = { path = "../heika-peer-protocol" }
heika-state-transition = { path = "../heika-state-transition" }
heika-store-redb = { path = "../heika-store-redb" }
heika-tls = { path = "../heika-tls" }
serde = { version = "1.0.229", features = ["derive"] }
serde_norway = "0.9.42"
rayon = "1.12.0"
zeroize = "1.9.1"

[dev-dependencies]
heika-transaction = { path = "../heika-transaction" }
