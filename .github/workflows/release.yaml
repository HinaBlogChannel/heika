# v1.2.3 の形のタグで、4つのターゲットのバイナリを作って Release に載せる。
# 手で回すと、ビルドまでして Release は作らない
name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.99.0

jobs:
  ci:
    uses: ./.github/workflows/ci.yaml

  version:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: タグと Cargo.toml のバージョンが同じか確かめる
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "heika-cli") | .version')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::タグ $GITHUB_REF_NAME と Cargo.toml のバージョン $version が違います"
            exit 1
          fi

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-15
          - target: x86_64-pc-windows-msvc
            os: windows-2025
    runs-on: ${{ matrix.os }}
    env:
      TARGET: ${{ matrix.target }}
      PACKAGE: heika-${{ github.ref_name }}-${{ matrix.target }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust のツールチェイン
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target "$TARGET"
          rustup default "$RUST_TOOLCHAIN"
      - name: musl の C コンパイラー（ring が使う）
        if: endsWith(matrix.target, '-musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          echo "CC_${TARGET//-/_}=musl-gcc" >> "$GITHUB_ENV"
      - run: cargo build --release --locked -p heika-cli --target "$TARGET"
      - name: 埋め込んだソースを、README の手順で実行せずに取り出せるか確かめる
        run: |
          case "$RUNNER_OS" in
            Linux)
              objcopy -O binary --only-section=.heika_source "target/$TARGET/release/heika" source.zip
              unzip -tq source.zip ;;
            macOS)
              segedit "target/$TARGET/release/heika" -extract __TEXT __heika_source source.zip
              unzip -tq source.zip ;;
            Windows)
              llvm-objcopy --dump-section .hksrc=source.zip "target/$TARGET/release/heika.exe"
              7z t source.zip ;;
          esac
      - name: まとめる
        run: |
          mkdir -p "dist/$PACKAGE"
          if [ "$RUNNER_OS" = Windows ]; then archive="$PACKAGE.zip"; else archive="$PACKAGE.tar.gz"; fi
          sed -e "s|{{VERSION}}|$GITHUB_REF_NAME|g" \
              -e "s|{{REPOSITORY}}|$GITHUB_REPOSITORY|g" \
              -e "s|{{ARCHIVE}}|$archive|g" \
              crates/heika-cli/assets/README.txt > "dist/$PACKAGE/README.txt"
          if grep -n '{{' "dist/$PACKAGE/README.txt"; then
            echo "::error::README.txt に埋めていない {{ }} があります"
            exit 1
          fi
          cp -r docs "dist/$PACKAGE/"
          cp LICENSE crates/heika-cli/THIRD-PARTY-LICENSES "dist/$PACKAGE/"
          cp crates/heika-wallet/src/bip39/NOTICE "dist/$PACKAGE/NOTICE-BIP39"
          if [ "$RUNNER_OS" = Windows ]; then
            cp "target/$TARGET/release/heika.exe" "dist/$PACKAGE/"
            (cd dist && 7z a "$PACKAGE.zip" "$PACKAGE")
          else
            cp "target/$TARGET/release/heika" "dist/$PACKAGE/"
            tar -C dist -czf "dist/$PACKAGE.tar.gz" "$PACKAGE"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.PACKAGE }}
          path: dist/${{ env.PACKAGE }}.*
          if-no-files-found: error

  publish:
    needs: [ci, build, version]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: heika-*
          path: dist
          merge-multiple: true
      - name: チェックサム
        run: (cd dist && sha256sum heika-* > SHA256SUMS)
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/heika-*
      - name: Release を作る
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # v0.2.0-rc.1 のようにハイフンのあるタグは、プレリリースにする
          prerelease=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            prerelease=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag --title "heika $GITHUB_REF_NAME" --generate-notes "${prerelease[@]}"
