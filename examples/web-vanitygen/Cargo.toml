[package]
name = "web-vanitygen"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

# heika のワークスペースには入れず、依存と Cargo.lock と最適化の設定を分ける
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

# 画面。trunk が index.html から組み立てる
[[bin]]
name = "app"
path = "src/bin/app.rs"

# アドレスを探す Web Worker。コアの数だけ立てる
[[bin]]
name = "worker"
path = "src/bin/worker.rs"

[dependencies]
heika-core = { path = "../../crates/heika-core", default-features = false, features = ["wasm_js"] }
js-sys = "0.3.106"
leptos = { version = "0.8.22", features = ["csr"] }
wasm-bindgen = "0.2.129"
web-sys = { version = "0.3.106", features = ["DedicatedWorkerGlobalScope", "MessageEvent", "Navigator", "Performance", "Window", "Worker"] }

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
# z や s にしても wasm-opt のあとで1割ほどしか小さくならないので、鍵を作る速さを優先する
opt-level = 3
