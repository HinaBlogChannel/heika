[package]
name = "heika-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# モバイルでは、この lib を Android と iOS のアプリから読み込む
[lib]
name = "heika_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
getrandom = { version = "0.4.3", features = ["sys_rng"] }
heika-core = { path = "../../../crates/heika-core" }
heika-rest = { path = "../../../crates/heika-rest" }
heika-transaction = { path = "../../../crates/heika-transaction" }
heika-wallet = { path = "../../../crates/heika-wallet" }
rand_core = "0.10.1"
# REST に HTTPS でつなぐ。ルート証明書は、同梱の一覧ではなく OS のものを使う
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2.12.4", features = ["tray-icon"] }
ureq = { version = "3.4.2", default-features = false, features = ["rustls-no-provider", "platform-verifier"] }
zeroize = "1.9.1"

# ノード（試験的）は、デスクトップと Android で動かす
[target.'cfg(not(target_os = "ios"))'.dependencies]
heika-node = { path = "../../../crates/heika-node" }

# デスクトップだけのもの
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
# 2つ目を起動したら、1つ目の窓を出す（通知領域に隠れていても）
tauri-plugin-single-instance = "2.5.4"

# Android で、ノードのスレッドが動いているあいだのフォアグラウンドサービス。ノードの出力をファイルに向けるのに libc
[target.'cfg(target_os = "android")'.dependencies]
libc = "0.2.190"
tauri-plugin-heika-node-service = { path = "../plugins/heika-node-service" }

# WebKitGTK が、持ち主のいないクリップボードから貼り付けると落ちるのを避ける（src/clipboard.rs）。Tauri が使っているのと同じ版
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18.2"
# 通知領域のアイコンに要る appindicator が読めるかを、置く前に確かめる（読めないと tray-icon が panic する）。tray-icon が使うのと同じ版
libloading = "0.7.4"
