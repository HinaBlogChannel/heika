[package]
name = "sunboru-kusa"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false
description = "すんぼる草不可避。送金で生えます"

# heika のワークスペースには入れず、依存と Cargo.lock を分ける。trunk で wasm にして、静的なファイルとして配る
[workspace]

[dependencies]
heika-core = { path = "../../crates/heika-core", default-features = false }
leptos = { version = "0.8.22", features = ["csr"] }
serde_json = "1.0.145"
sha3 = "0.12.0"
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4.79"
js-sys = "0.3.106"
web-sys = { version = "0.3.106", features = ["Window", "Document", "Storage", "Response", "Location", "UrlSearchParams", "Navigator"] }

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
opt-level = "z"
