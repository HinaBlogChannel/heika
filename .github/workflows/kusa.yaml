# すんぼる草不可避をビルドして、Artifact に上げる。手で動かすだけで、Pages や Release には出さない。
#
# 公開ノードの一覧は、ここで種のノードから全部辿って作り、リポジトリには入れない。
# - Secrets の KUSA_SEED_MAINNET / KUSA_SEED_TESTNET: 辿り始める REST の URL（片方だけでもよい）
# - Secrets の KUSA_EXCLUDE: 一覧に入れないホスト名（カンマ区切り）。自分のノードなど
# - 変数の KUSA_TARGET: 作者の受け取り用のアドレス。なければ、遊ぶ人が自分で決める
# - 変数の KUSA_MIN_XYM: 数える最低額（XYM）。なければ 1
name: すんぼる草不可避

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust
        with:
          components: rustfmt,clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            apps/sunboru-kusa
            apps/sunboru-kusa/discover
      - name: 確かめる
        working-directory: apps/sunboru-kusa
        run: |
          cargo fmt --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo clippy --target wasm32-unknown-unknown --locked -- -D warnings
          cargo test --locked
          (cd discover && cargo fmt --check && cargo clippy --all-targets --locked -- -D warnings)
      - name: 公開ノードを探す
        working-directory: apps/sunboru-kusa/discover
        env:
          KUSA_SEED_MAINNET: ${{ secrets.KUSA_SEED_MAINNET }}
          KUSA_SEED_TESTNET: ${{ secrets.KUSA_SEED_TESTNET }}
          KUSA_EXCLUDE: ${{ secrets.KUSA_EXCLUDE }}
        run: cargo run --release --locked -- "$RUNNER_TEMP/nodes.json"
      - uses: ./.github/actions/trunk
      - name: ビルドする
        working-directory: apps/sunboru-kusa
        env:
          KUSA_TARGET: ${{ vars.KUSA_TARGET }}
          KUSA_MIN_XYM: ${{ vars.KUSA_MIN_XYM }}
        run: KUSA_NODES="$RUNNER_TEMP/nodes.json" trunk build --release --locked
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sunboru-kusa
          path: apps/sunboru-kusa/dist
