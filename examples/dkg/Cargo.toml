[package]
name = "dkg"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false
description = "Symbol を掲示板にして、ディーラーなしで FROST の鍵を分けて作る（DKG）"

# heika のワークスペースには入れず、依存と Cargo.lock を分ける
[workspace]

[dependencies]
chacha20poly1305 = "0.10.1"
# internals: 知識の証明を、参加者でない人も確かめられるようにする
frost-core = { version = "3.0.0", features = ["internals"] }
frost-ed25519 = "3.0.0"
heika-core = { path = "../../crates/heika-core" }
heika-node = { path = "../../crates/heika-node" }
heika-rest = { path = "../../crates/heika-rest" }
heika-transaction = { path = "../../crates/heika-transaction" }
# frost が使う rand_core 0.6 の、OS の乱数
rand_core = { version = "0.6.4", features = ["getrandom"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
ureq = { version = "3.4.2", default-features = false }
x25519-dalek = { version = "2.0.1", features = ["static_secrets", "zeroize"] }
zeroize = "1.9.1"
