[package]
name = "heika-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "heika"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
der = "0.8.2"
getrandom = { version = "0.4.3", features = ["sys_rng"] }
heika-cert = { version = "0.1.0", path = "../heika-cert", features = ["bootstrap-compat", "shoestring-compat"] }
heika-core = { version = "0.1.0", path = "../heika-core" }
heika-p2p = { version = "0.1.0", path = "../heika-p2p" }
heika-tls = { version = "0.1.0", path = "../heika-tls" }
heika-transaction = { version = "0.1.0", path = "../heika-transaction" }
heika-wallet = { version = "0.1.0", path = "../heika-wallet" }
rand_core = "0.10.1"
zeroize = "1.9.1"
