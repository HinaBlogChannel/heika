[package]
name = "heika-vectors"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }

[dev-dependencies]
heika-core = { path = "../heika-core" }
heika-transaction = { path = "../heika-transaction" }
heika-wallet = { path = "../heika-wallet" }
rand_core = { version = "0.10.1", default-features = false }
