[package]
name = "heika-gui-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# heika のワークスペースには入れず、依存と Cargo.lock を分ける。
# このパッケージは WebView に出す画面（trunk で wasm にする）で、src-tauri がアプリの本体
[workspace]
members = ["src-tauri", "plugins/heika-node-service"]

# 版は heika のワークスペースと同じにする。CI で確かめる
[workspace.package]
version = "0.7.0"
edition = "2024"
license = "AGPL-3.0-only"

[dependencies]
leptos = { version = "0.8.22", features = ["csr"] }
serde = { version = "1.0.229", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4.79"

# 依存は debug でも最適化する。しないと、キーストアの scrypt に何秒もかかる
[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
